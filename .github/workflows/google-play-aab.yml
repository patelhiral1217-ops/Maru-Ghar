name: Prepare Maru Ghar Google Play AAB
on:
  workflow_dispatch:
  push:
    branches: [play-store-prep]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and run the complete existing app test suite
        run: |
          npm install
          npm run copy-web
          npm test

  play-aab:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install dependencies and build the existing web assets
        run: |
          npm install
          npm run copy-web
      - name: Require permanent Play upload signing key
        env:
          KS_B64: ${{ secrets.MARU_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MARU_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.MARU_PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MARU_PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KS_B64" || { echo "::error::Add MARU_PLAY_UPLOAD_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$KS_PASS" || { echo "::error::Add MARU_PLAY_UPLOAD_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$KS_ALIAS" || { echo "::error::Add MARU_PLAY_UPLOAD_KEY_ALIAS repository secret."; exit 1; }
          test -n "$KEY_PASS" || { echo "::error::Add MARU_PLAY_UPLOAD_KEY_PASSWORD repository secret."; exit 1; }
      - name: Bundle the existing OTA bridge for the native WebView
        run: |
          mkdir -p www/assets
          npx esbuild scripts/maru-ghar-ota.js --bundle --format=esm --platform=browser --target=es2020 --outfile=www/assets/maru-ghar-ota.bundle.js
          test -s www/assets/maru-ghar-ota.bundle.js
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"
      - name: Generate Capacitor Android project without changing app source
        run: |
          npm install @capacitor/cli@^7 @capacitor/core@^7 @capacitor/android@^7 @capacitor/push-notifications@^7 @capacitor/assets@^3 @capgo/capacitor-updater@^7
          npx cap add android
          cp google-services.json android/app/google-services.json
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"
          npx cap sync android
          test -f android/variables.gradle
          sed -i "s/compileSdkVersion = 35/compileSdkVersion = 36/; s/targetSdkVersion = 35/targetSdkVersion = 36/; s/buildToolsVersion = '35.0.0'/buildToolsVersion = '36.0.0'/" android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q "buildToolsVersion = '36.0.0'" android/variables.gradle
      - name: Generate approved Maru Ghar launcher icon
        run: |
          test -s assets/maru-ghar-approved-app-icon.png
          cp assets/maru-ghar-approved-app-icon.png assets/icon.png
          ./node_modules/.bin/capacitor-assets generate --android --iconBackgroundColor '#12382f' --splashBackgroundColor '#12382f'
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build Android App Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Sign AAB with permanent Play upload key
        env:
          KS_B64: ${{ secrets.MARU_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MARU_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.MARU_PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MARU_PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > maru-play-upload.jks
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore maru-play-upload.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" android/app/build/outputs/bundle/release/app-release.aab "$KS_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          mkdir -p release
          cp android/app/build/outputs/bundle/release/app-release.aab release/Maru-Ghar-Play-Upload.aab
          sha256sum release/Maru-Ghar-Play-Upload.aab > release/checksum.txt
          rm -f maru-play-upload.jks
      - uses: actions/upload-artifact@v4
        with:
          name: maru-ghar-google-play-aab
          path: release/
          if-no-files-found: error
