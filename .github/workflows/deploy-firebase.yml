name: Deploy Maru Ghar Firebase Hosting
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'privacy.html'
      - 'download.html'
      - 'firebase-config.js'
      - 'google-services.json'
      - 'assets/**'
      - 'scripts/copy-web.mjs'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase.yml'
jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build website folder
        run: |
          npm run copy-web
          npm test
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13
      - name: Deploy Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || (echo "Missing FIREBASE_SERVICE_ACCOUNT repository secret" && exit 1)
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only hosting --project maru-ghar-gandhinagar-8dbe4 --non-interactive
