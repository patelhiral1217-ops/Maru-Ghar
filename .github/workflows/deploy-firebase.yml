name: Deploy Maru Ghar Firebase Hosting
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'privacy.html'
      - 'download.html'
      - 'firebase-config.js'
      - 'google-services.json'
      - 'assets/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'functions/**'
      - 'scripts/copy-web.mjs'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase.yml'
jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Build website folder
        run: npm run copy-web
      - name: Run full project validation
        run: npm test
      - name: Hosting preflight
        run: node scripts/hosting-preflight.mjs
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13
      - name: Identify deployment service account safely
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e 'const s=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT); console.log("GitHub deployment service account:", s.client_email || "client_email missing")'
      - name: Deploy Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || (echo "Missing FIREBASE_SERVICE_ACCOUNT repository secret" && exit 1)
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only hosting --project maru-ghar-gandhinagar-8dbe4 --non-interactive
      - name: Deploy Firestore security rules
        if: github.event_name == 'push'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq "^(firestore.rules|.github/workflows/deploy-firebase.yml)$"; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            firebase deploy --only firestore:rules --project maru-ghar-gandhinagar-8dbe4 --non-interactive
          else
            echo "No Firestore rules change; deployment skipped."
          fi
      - name: Deploy Firestore indexes only when changed
        if: github.event_name == 'push'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^firestore.indexes.json$'; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            firebase deploy --only firestore:indexes --project maru-ghar-gandhinagar-8dbe4 --non-interactive
          else
            echo "No Firestore index change; deployment skipped."
          fi
      - name: Deploy Cloud Functions when changed
        if: github.event_name == 'push' && vars.DEPLOY_CLOUD_FUNCTIONS == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^functions/'; then
            npm install --prefix functions --no-audit --no-fund
            if [ -n "$CLOUDINARY_API_KEY" ] && [ -n "$CLOUDINARY_API_SECRET" ]; then
              printf "CLOUDINARY_API_KEY=%s\\nCLOUDINARY_API_SECRET=%s\\n" "$CLOUDINARY_API_KEY" "$CLOUDINARY_API_SECRET" > functions/.env
            fi
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            firebase deploy --only functions --project maru-ghar-gandhinagar-8dbe4 --non-interactive
          else
            echo "Cloud Functions deployment is disabled unless repository variable DEPLOY_CLOUD_FUNCTIONS=true. This avoids attempting a Blaze-only deployment on the current plan."
          fi

# Re-deploy restored approved Maru Ghar appearance.
