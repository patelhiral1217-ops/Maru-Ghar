name: Maru Ghar quality checks
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Firebase Hosting folder
        run: npm run copy-web
      - name: Run complete project checks
        run: npm test
