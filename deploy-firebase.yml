name: Deploy Firebase (Functions / Rules)
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'functions = Cloud Functions; rules = Firestore rules+indexes (ONLY after owner-phone migration); hosting = website'
        required: true
        default: functions
        type: choice
        options: [functions, rules, hosting]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/firebase-deploy-preflight.mjs
      - run: npm install --prefix functions
      - run: npm install && npm run copy-web
      - name: Deploy
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET: ${{ inputs.target }}
          CK: ${{ secrets.CLOUDINARY_API_KEY }}
          CS: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          if [ -n "$CK" ] && [ -n "$CS" ]; then printf "CLOUDINARY_API_KEY=%s\nCLOUDINARY_API_SECRET=%s\n" "$CK" "$CS" > functions/.env; fi
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          if [ "$TARGET" = "rules" ]; then ONLY="firestore:rules,firestore:indexes"; elif [ "$TARGET" = "hosting" ]; then ONLY="hosting"; else ONLY="functions"; fi
          npx -y firebase-tools@13 deploy --only "$ONLY" --project maru-ghar-gandhinagar-8dbe4 --non-interactive
