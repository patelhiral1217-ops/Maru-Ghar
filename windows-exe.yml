name: Build Maru Ghar Windows EXE
on:
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run copy-web
      - run: npm run desktop:win
      - uses: actions/upload-artifact@v4
        with:
          name: maru-ghar-windows-setup
          path: dist-desktop/*.exe
