name: Build Maru Ghar Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Install and run tests
        run: |
          npm install
          npm run copy-web
          npm test
      - name: Add Android project
        run: |
          npx cap add android
          cp google-services.json android/app/google-services.json
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <application#' $M
          npx cap sync android
      - name: App icons (best effort)
        continue-on-error: true
        run: npx capacitor-assets generate --android
      - name: Build release APK (unsigned)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Sign APK (debug key if secrets missing)
        env:
          KS_B64: ${{ secrets.MARU_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MARU_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.MARU_KEY_ALIAS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f -p 4 "$IN" aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            $BT/apksigner sign --ks release.jks --ks-key-alias "$KS_ALIAS" --ks-pass pass:"$KS_PASS" --key-pass pass:"$KS_PASS" --out Maru-Ghar-release.apk aligned.apk
          else
            echo "No signing secrets: building TEST debug-signed APK"
            keytool -genkeypair -keystore debug.jks -storepass android -keypass android -alias dbg -dname "CN=Test" -keyalg RSA -keysize 2048 -validity 3650
            $BT/apksigner sign --ks debug.jks --ks-key-alias dbg --ks-pass pass:android --key-pass pass:android --out Maru-Ghar-TEST.apk aligned.apk
          fi
          $BT/apksigner verify --print-certs Maru-Ghar-*.apk
          sha256sum Maru-Ghar-*.apk | tee checksum.txt
      - uses: actions/upload-artifact@v4
        with:
          name: maru-ghar-apk
          path: |
            Maru-Ghar-*.apk
            checksum.txt
